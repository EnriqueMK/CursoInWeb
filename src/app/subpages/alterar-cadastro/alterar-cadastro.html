<div class="container">
    <p id="titulo-header">Alterar Cadastro</p>
    <p>Meu Painel >> Alterar Cadastro</p>
</div>
<div class="formulario">
    <p class="titulo-main">Detalhes da Conta</p>
    <form>
        <label for="input-nome">Nome</label>
        <input type="text" name="input-nome" id="input-nome" class="input-simples" [(ngModel)]="aluno.nome">

        <label for="input-email">E-mail</label>
        <input type="text" name="input-email" id="input-email" class="input-simples" [(ngModel)]="aluno.email">

        <label for="input-phone">Telefone</label>
        <input type="text" name="input-phone" id="input-phone" class="input-simples" [(ngModel)]="aluno.phone">

        <label for="input-current-password">Senha Atual (deixe em branco para não alterar)</label>
        <input type="password" name="input-current-password" id="input-current-password" class="input-simples" [(ngModel)]="alunoAtualizado.senhaAtual">

        <label for="input-new-password">Nova Senha (deixe em branco para não alterar)</label>
        <input type="password" name="input-new-password" id="input-new-password" class="input-simples" [(ngModel)]="alunoAtualizado.currentPassword">

        <label for="input-passwordConfirm">Confirmar Senha</label>
        <input type="password" name="input-passwordConfirm" id="input-passwordConfirm" class="input-simples" [(ngModel)]="alunoAtualizado.newPasswordConfirm">
        <button type="button" class="input-submeter" (click)="salvarAlteracoes()">Salvar alterações</button>
    </form>
    <div id="vazio"></div>
</div>
