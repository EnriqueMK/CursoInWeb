<div class="container">
    <p id="titulo-header">Excluir Conta</p>
    <p>Meu Painel >> Excluir Conta</p>
</div>
<div class="formulario">
    <p class="titulo-main">Tem certeza que deseja excluir sua conta?</p>
    <form (ngSubmit)="excluirAluno()">
        <label for="input-email">Digite seu E-mail</label>
        <input type="text" 
        [(ngModel)]="emailExcluir" 
        name="input-email" 
        id="input-email" 
        class="input-simples"
        required>
        <button type="submit" class="input-submeter">Excluir Conta</button>
    </form>
</div>
