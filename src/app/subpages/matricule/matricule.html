<div class="formulario">
    <p>Matricule-se</p>
    <form>
        <label for="input-nome">Nome</label>
        <input type="text" name="input-nome" id="input-nome" class="input-simples" placeholder="Nome" [(ngModel)]="aluno.nome">

        <label for="input-email">E-mail</label>
        <input type="text" name="input-email" id="input-email" class="input-simples" placeholder="Email" [(ngModel)]="aluno.email">

        <label for="input-phone">Telefone</label>
        <input type="text" name="input-phone" id="input-phone" class="input-simples" placeholder="Telefone" [(ngModel)]="aluno.phone">

        <label for="input-password">Senha</label>
        <input type="password" name="input-password" id="input-password" class="input-simples" placeholder="Senha" [(ngModel)]="aluno.password">

        <label for="input-passwordConfirm">Confirmar Senha</label>
        <input type="password" name="input-passwordConfirm" id="input-passwordConfirm" class="input-simples" placeholder="Confirmar Senha" [(ngModel)]="aluno.passwordConfirm">

        <button type="button" class="input-submeter" (click)="submeter()">Cadastrar</button>
    </form>
</div>
