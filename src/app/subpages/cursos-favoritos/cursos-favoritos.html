<div class="container">
    <p id="titulo-header">Cursos Favoritos</p>
    <p><a routerLink="/meu-painel" routerLinkActive="active">Meu Painel</a> >> Meus Cursos Favoritos</p>
</div>
<div class="container2">
  <div class="movimentacao">
    <p class="titulo-main">Meus Cursos Favoritos</p>
    <div class="conteudo">
      <ol>
        <li *ngFor="let curso of listaCursos">
          {{ curso }}
          <button type="button" (click)="removerCurso(curso)">Remover</button>
        </li>
      </ol>
    </div>
  </div>
  <div id="vazio"></div>
</div>
